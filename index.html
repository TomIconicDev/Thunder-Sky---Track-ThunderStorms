<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Thunder Sky</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <meta name="theme-color" content="#030513">
</head>
<body>

  <div class="topbar">
    <div class="brand-row">
      <div class="title-group">
        <h1>Thunder Sky</h1>
        <div class="status-indicator">
          <div class="status-pulse"></div>
          <span id="status">Active Tracking</span>
        </div>
      </div>
      
      <div class="selector-group">
        <label for="country-selector">Region:</label>
        <select id="country-selector">
          <option value="uk">United Kingdom</option>
          <option value="us">United States</option>
          <option value="de">Germany</option>
          <option value="au">Australia</option>
          <option value="br">Brazil</option>
        </select>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div class="storm-panel">
    <div class="metrics-container">
      <div class="card">
        <h2>Nearest Strike</h2>
        <div id="distance">-- <span class="unit">km</span></div>
      </div>

      <div class="card">
        <h2>Thunder Delay</h2>
        <div id="delay">-- <span class="unit">sec</span></div>
      </div>
    </div>
    
    <div class="control-row">
      <button class="action-btn" id="recenter-btn" title="Recenter View">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
      <button class="action-btn active" id="radar-toggle" title="Toggle Radar Filter">
        <i class="fa-solid fa-layer-group"></i>
      </button>
    </div>
  </div>

  <audio id="thunderAudio" src="assets/thunder.mp3" preload="auto"></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
