<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Thunder Sky</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <meta name="theme-color" content="#ffd60a">
</head>
<body>

  <div class="topbar">
    <div class="brand-row">
      <button class="nav-utility-btn" id="recenter-btn" title="Recenter to Position">
        <i class="fa-solid fa-location-arrow"></i>
      </button>
      <div class="title-wrapper">
        <h1 class="main-title">My Lightning Tracker</h1>
        <div class="view-pill-selector">
          <span class="pill active">Latest</span>
          <span class="pill">Hotspots</span>
          <span class="pill" id="hud-radar-status">Radar Active</span>
        </div>
      </div>
      <div class="selector-wrapper">
        <select id="country-selector">
          <option value="uk">UK</option>
          <option value="us">US</option>
          <option value="de">DE</option>
          <option value="au">AU</option>
          <option value="br">BR</option>
        </select>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div class="playback-dock" id="radar-control-dock">
    <div class="dock-inner">
      <button class="radar-play-btn active" id="radar-toggle" title="Toggle Live Weather Radar">
        <i class="fa-solid fa-play" id="radar-icon"></i>
      </button>
      <span class="timeline-label">Now</span>
      <div class="timeline-track">
        <div class="timeline-thumb"></div>
      </div>
    </div>
  </div>

  <div class="detail-sheet" id="detail-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
      <div class="location-meta">
        <h2 id="inspect-region">Striking Region</h2>
        <p id="inspect-coords">0.0000, 0.0000</p>
      </div>
      <button class="close-sheet-btn" id="close-sheet">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="telemetry-grid">
      <div class="metric-item">
        <span class="met-label">Severity Index</span>
        <span class="met-value highlight-yellow" id="inspect-severity">M 0.0</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Impact Proximity</span>
        <span class="met-value" id="inspect-distance">0 km</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Thunder Delay</span>
        <span class="met-value" id="inspect-delay">0 sec</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Audible Range</span>
        <span class="met-value" id="inspect-range">0 mi</span>
      </div>
    </div>

    <button class="share-action-btn" id="share-strike-btn">
      Share Strike Location
    </button>
  </div>

  <audio id="thunderAudio" src="assets/thunder.mp3" preload="auto"></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
