<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Thunder Sky</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" />
  
  <meta name="theme-color" content="#1c1c1e">
</head>
<body>

  <div id="map"></div>

  <div class="floating-hud-top">
    <button class="hud-circle-btn" id="recenter-btn" title="Recenter to Position">
      <i class="fa-solid fa-location-arrow"></i>
    </button>
    <div class="hud-selector-card">
      <select id="country-selector">
        <option value="uk">UK Tracker</option>
        <option value="us">US Tracker</option>
        <option value="de">DE Tracker</option>
        <option value="au">AU Tracker</option>
        <option value="br">BR Tracker</option>
      </select>
    </div>
  </div>

  <div class="floating-hud-bottom" id="radar-toggle-container">
    <button class="radar-toggle-pill active" id="radar-toggle">
      <div class="radar-pulse-dot"></div>
      <span id="radar-status-text">3D Radar Active</span>
    </button>
  </div>

  <div class="detail-sheet" id="detail-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
      <div class="location-meta">
        <h2 id="inspect-region">Striking Event</h2>
        <p id="inspect-coords">0.0000, 0.0000</p>
      </div>
      <button class="close-sheet-btn" id="close-sheet">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="telemetry-grid">
      <div class="metric-item">
        <span class="met-label">Severity Index</span>
        <span class="met-value highlight-yellow" id="inspect-severity">M 0.0</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Impact Proximity</span>
        <span class="met-value" id="inspect-distance">0 km</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Thunder Delay</span>
        <span class="met-value" id="inspect-delay">0 sec</span>
      </div>
      <div class="metric-item">
        <span class="met-label">Audible Range</span>
        <span class="met-value" id="inspect-range">0 mi</span>
      </div>
    </div>

    <button class="share-action-btn" id="share-strike-btn">
      Share Strike Location
    </button>
  </div>

  <audio id="thunderAudio" src="assets/thunder.mp3" preload="auto"></audio>

  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
